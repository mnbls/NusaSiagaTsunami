<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nusa Siaga — Petualangan Mitigasi Tsunami</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=20261127b">
</head>
<body>

<div class="deco" aria-hidden="true">
  <span class="sun"></span>
  <span class="cloud c1"></span>
  <span class="cloud c2"></span>
  <span class="cloud c3"></span>
  <div class="waves"></div>
</div>

<header class="topbar">
  <div class="top-left">
    <button class="pill nav-btn" id="backBtn" type="button" hidden aria-label="Kembali"><span data-ico="arrow-left" aria-hidden="true"></span><span class="nav-lbl">Kembali</span></button>
    <button class="pill nav-btn" id="homeBtn" type="button" hidden aria-label="Beranda"><span data-ico="house" aria-hidden="true"></span><span class="nav-lbl">Beranda</span></button>
    <button class="logo" id="logoBtn" type="button"><span class="logo-ico" data-ico="wave" aria-hidden="true"></span> Nusa Siaga</button>
  </div>
  <div class="top-right">
    <span class="pill" title="Total bintang"><span data-ico="star" aria-hidden="true"></span> <b id="starTotal">0</b>/<span id="starMax">0</span></span>
    <button class="pill icon" id="soundBtn" type="button" aria-pressed="true" aria-label="Suara"></button>
  </div>
</header>

<main id="app" tabindex="-1"></main>

<footer class="site-foot">
  Materi disarikan dari panduan umum kesiapsiagaan tsunami (BMKG &amp; BNPB).
  Cocokkan lagi dengan sumber resmi sebelum dipakai untuk pembelajaran formal.
</footer>

<div id="feedback" class="feedback" role="status" aria-live="polite"></div>
<div id="modal" class="modal"></div>

<!-- Three.js: pakai salinan lokal di vendor/ jika ada (bisa tanpa internet), kalau tidak ada ambil dari CDN. -->

<script src="intro.js?v=20261127b"></script>
<script src="explain.js?v=20261127b"></script>
<script src="music.js?v=20261127b"></script>
<script src="celebrate.js?v=20261127b"></script>
<script src="audio/voice/manifest.js?v=20261127b"></script>
<script src="firebase-config.js?v=20261127b"></script>
<script src="game.js?v=20261127b"></script>
<!-- Login dan database online (Firebase). Tanpa konfigurasi, game tetap berjalan dalam mode tamu. -->
<script type="module" src="cloud.js?v=20261127b"></script>
</body>
</html>
